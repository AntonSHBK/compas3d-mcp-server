[project]
name = "kompas3d-mcp-server"
version = "0.1.0"
description = "MCP integration for KOMPAS-3D on Windows"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
markers = [
    "integration: requires a built bridge and a locally installed KOMPAS-3D",
]
